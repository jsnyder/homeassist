[package]
name = "homeassist"
version = "0.4.0"
edition = "2024"
description = "Token-efficient Home Assistant CLI for AI agents"
license = "MIT"
repository = "https://github.com/jsnyder/homeassist"
homepage = "https://github.com/jsnyder/homeassist"
authors = ["Jesse Snyder"]
keywords = ["home-assistant", "iot", "smart-home", "cli", "automation"]
categories = ["command-line-utilities"]

[[bin]]
name = "homeassist"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
percent-encoding = "2"
regex = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio-tungstenite = { version = "0.26", features = ["connect"] }
futures-util = "0.3"
glob = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
httpmock = "0.7"
tempfile = "3"
