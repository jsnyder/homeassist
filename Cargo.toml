[package]
name = "homeassist"
version = "0.1.0"
edition = "2024"
description = "Token-efficient Home Assistant CLI for AI agents"
license = "MIT"
repository = "https://github.com/jsnyder/homeassist"

[[bin]]
name = "homeassist"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
percent-encoding = "2"
regex = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
httpmock = "0.7"
tempfile = "3"
